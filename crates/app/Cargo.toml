[package]
name = "aftermission"
description = "Aftermission, a post-mission review tool for ArduPilot dataflash logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aftermission"
path = "src/main.rs"

[dependencies]
dflog.workspace = true
eframe.workspace = true
egui.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true
rfd.workspace = true
walkers.workspace = true
serde.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["parquet"]
# File > Export > Whole log as Parquet, through dflog's exporter. It pulls
# in the arrow dependency tree; the web build (M5) leaves it out.
parquet = ["dflog/parquet"]

[dev-dependencies]
egui_kittest.workspace = true
ron.workspace = true

[lints]
workspace = true
