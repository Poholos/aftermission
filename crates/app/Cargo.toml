[package]
name = "aftermission"
description = "Aftermission, a post-mission review tool for ArduPilot dataflash logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aftermission"
path = "src/main.rs"

[dependencies]
dflog.workspace = true
eframe.workspace = true
egui.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true
walkers.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The file dialogs, the memory map, and the export's temporary file have
# no browser counterpart; the web build reads and writes through the page.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dflog = { workspace = true, features = ["mmap"] }
rfd.workspace = true
tempfile.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true

[features]
default = ["parquet"]
# File > Export > Whole log as Parquet, through dflog's exporter. It pulls
# in the arrow dependency tree and a folder picker, so it is native only:
# the web build, through Trunk.toml, leaves it out.
parquet = ["dflog/parquet"]

# The executable's icon: only a Windows host can embed the resource.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
image.workspace = true
ron.workspace = true

[lints]
workspace = true
