# cargo-deny policy. Run `cargo deny check`.
#
# Aftermission is AGPL-3.0-only and also offered under a separate commercial
# license (see LICENSING.md), so every dependency must be one the copyright
# holder can relicense for closed-source use: permissive licenses only. Any
# license not listed here, copyleft (GPL, LGPL, AGPL) or weak copyleft
# (MPL-2.0) included, fails the check for deliberate review. Crates that
# offer a copyleft license only as an alternative to MIT or Apache are fine;
# cargo-deny picks the permitted option.

[graph]
# The Parquet export is a feature; its arrow tree is checked whatever the
# default.
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Windows clipboard support (clipboard-win, error-code via egui/arboard).
    "BSL-1.0",
    # egui's bundled default fonts (epaint_default_fonts). Both apply to the
    # font files only; the Ubuntu license restricts modifying or renaming the
    # font, which does not affect bundling it unchanged.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Mozilla's root certificate store as data (webpki-root-certs), behind
    # the TLS verifier of the map's tile downloads (walkers -> reqwest ->
    # rustls-platform-verifier). A permissive data license.
    "CDLA-Permissive-2.0",
]
# Our own crate is unpublished and carries the workspace license.
private = { ignore = true }

# tiny-keccak, through const-random and ahash's compile-time-rng, which
# arrow-array (the Parquet export) takes on wasm32 only: a dependency of a
# proc-macro that runs at build time, never linked into the app. CC0-1.0
# waives all rights, so it bars no relicensing; allowed for this crate
# alone rather than for any crate.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

[bans]
# The egui/wgpu/winit stack pulls dozens of transitive duplicates that we
# cannot resolve from here; report them without failing the check.
multiple-versions = "warn"

[advisories]
yanked = "deny"
# Unmaintained-crate notices we cannot act on. Each must name the path that
# pulls the crate in and what would let us drop the entry.
ignore = [
    # `ttf-parser` via winit -> sctk-adwaita -> ab_glyph: Wayland client-side
    # window decorations, Linux only. Goes away when winit moves ab_glyph
    # forward; see https://github.com/harfbuzz/ttf-parser/issues/217.
    "RUSTSEC-2026-0192",
]
