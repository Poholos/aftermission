# cargo-about: the third-party notices shipped with the web bundle. Run
# `cargo about generate --manifest-path crates/app/Cargo.toml about.hbs`.
# The accepted list mirrors the policy in deny.toml, which is what
# `cargo deny check` enforces; a crate under anything else fails here too.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Only what the browser bundle links.
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crate carries the workspace terms and is not a third party.
private = { ignore = true }
