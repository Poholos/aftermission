# Every push and pull request: format, lints and tests on Linux, the test
# suite on Windows too, the dependency policy, and a real web build, since
# a wasm clippy run never links. The toolchain comes from
# rust-toolchain.toml. The bundle is kept as an artifact, and a push to
# main publishes it as the repository's Pages site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux libraries for eframe and the file dialog
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev cmake
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # the build without the Parquet export, which the web build is
      - name: Clippy without default features
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test without default features
        if: runner.os == 'Linux'
        run: cargo test --workspace --no-default-features

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@v1.24.0
      - name: Install trunk and cargo-about
        run: cargo binstall --no-confirm trunk cargo-about
      # The About dialog names the commit, so a page deployed between
      # releases says which main it is. A pull request's own head, not the
      # merge commit GitHub builds it as.
      - name: Name the commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "AFTERMISSION_COMMIT=${SHA::7}" >> "$GITHUB_ENV"
      - name: Clippy for wasm
        run: cargo clippy -p aftermission --target wasm32-unknown-unknown --no-default-features -- -D warnings
      # Trunk.toml leaves the parquet feature out. The Pages site serves
      # the bundle under the repository's name, case included; a local
      # trunk serve keeps /. The web-bundle artifact carries the path too:
      # it runs served from a folder named aftermission, not from its root.
      - name: Build the release bundle
        run: trunk build --release --public-url /aftermission/
      # The copyright notices and license texts of everything the bundle
      # links, which its MIT and BSD components require to travel with it.
      # The feature is left out here as well: with it, the wasm32 graph
      # holds tiny-keccak, allowed by deny.toml for the native build alone.
      - name: Third-party notices
        run: cargo about generate --manifest-path crates/app/Cargo.toml --no-default-features --fail about.hbs -o dist/third-party.html
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: dist
          retention-days: 3
      # the same bundle packed as the artifact the Pages deployment takes
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # Publishes the web build to https://poholos.github.io/aftermission/.
  # The github-pages environment lets main alone deploy; the Pages
  # permissions are this job's, the rest of the workflow reads only.
  deploy:
    name: Deploy the web build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, deny, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
